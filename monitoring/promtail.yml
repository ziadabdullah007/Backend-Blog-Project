server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://blog_loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: blog_api
    static_configs:
      - targets:
          - localhost
        labels:
          job: blog_api
          __path__: /app/logs/*.log